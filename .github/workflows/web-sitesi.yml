# neticeoptik.com web sitesini (web-sitesi/ klasörü) Cloudflare Pages'e yayınlar.
#  - ilk-surum / main dalına giren değişiklik: canlı site (www.neticeoptik.com)
#  - PR: önizleme adresi (onizleme.neticeoptik.pages.dev), canlı site değişmez
# Gerekli secret'lar: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID.
name: Web sitesi

on:
  workflow_dispatch:
  push:
    branches: [main, ilk-surum]
    paths:
      - 'web-sitesi/**'
      - '.github/workflows/web-sitesi.yml'
  pull_request:
    paths:
      - 'web-sitesi/**'
      - '.github/workflows/web-sitesi.yml'

concurrency:
  group: web-sitesi-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    # Başka depolardan (fork) gelen PR'larda secret yoktur.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağlantılar ve dosyalar yerinde mi?
        run: |
          set -euo pipefail
          cd web-sitesi
          eksik=0
          for f in *.html; do
            for yol in $(grep -oE '(href|src)="[^"#:]+"' "$f" | sed -E 's/^(href|src)="([^"]+)"$/\2/' | sed 's/[?#].*//'); do
              [ -z "$yol" ] && continue
              if [ ! -e "$yol" ]; then echo "::error file=web-sitesi/$f::Eksik dosya: $yol"; eksik=1; fi
            done
          done
          test "$eksik" = 0

      - name: Yayınla
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID secret'ları gerekli."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then DAL=onizleme; else DAL=main; fi
          rm -f web-sitesi/BENIOKU.md
          npx --yes wrangler@4 pages deploy web-sitesi --project-name=neticeoptik --branch="$DAL" --commit-dirty=true | tee yayin.log
          ADRES=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' yayin.log | tail -n1 || true)
          {
            if [ "$DAL" = main ]; then echo "### Site yayında: https://www.neticeoptik.com"; else echo "### Önizleme: https://onizleme.neticeoptik.pages.dev"; fi
            echo "Bu yükleme: $ADRES"
          } >> "$GITHUB_STEP_SUMMARY"
