# neticeoptik.com web sitesini (web-sitesi/ klasörü) 15 dile çevirip Cloudflare Pages'e yayınlar.
# Çeviri: tool/site/cevir.py (ANTHROPIC_API_KEY); dil videoları: site-videolari.yml.
#  - ilk-surum / main dalına giren değişiklik: canlı site (www.neticeoptik.com)
#  - PR: önizleme adresi (onizleme.neticeoptik.pages.dev), canlı site değişmez
# Gerekli secret'lar: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID.
name: Web sitesi

on:
  workflow_dispatch:
  # Kılavuz PDF'leri yenilenince kilavuz-pdf.yml bu işi (aynı dalda) yeniden başlatır.
  push:
    branches: [main, ilk-surum]
    paths:
      - 'web-sitesi/**'
      - 'tool/site/**'
      - 'tool/ornek_raporlar_test.dart'
      - 'lib/ui/sample_reports.dart'
      - 'lib/reports/**'
      - '.github/workflows/web-sitesi.yml'
  pull_request:
    paths:
      - 'web-sitesi/**'
      - 'tool/site/**'
      - 'tool/ornek_raporlar_test.dart'
      - 'lib/ui/sample_reports.dart'
      - 'lib/reports/**'
      - '.github/workflows/web-sitesi.yml'

concurrency:
  group: web-sitesi-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  yayinla:
    runs-on: ubuntu-latest
    # Başka depolardan (fork) gelen PR'larda secret yoktur.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet beautifulsoup4 anthropic pillow

      - name: Dillerin videoları (site-videolari sürümü)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/_v build/site/video
          gh release download site-videolari -D build/_v --clobber 2>/dev/null || echo "Henüz dil videosu yok; Türkçe videolar kalır."
          for f in build/_v/*; do
            [ -e "$f" ] || continue
            b=$(basename "$f"); dil=${b%%_*}; ad=${b#*_}
            mkdir -p "build/site/video/$dil" && mv "$f" "build/site/video/$dil/$ad"
          done
          ls -R build/site/video | head -50

      # Genel tanıtım videosu (egitim-video.yml üretir): her dil kendi videosunu gösterir.
      # Site için 720p'ye sıkıştırılır (hızlı açılış); kapak 5. saniyeden alınır.
      - name: Genel tanıtım videoları (egitim-videolari sürümü, 15 dil)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p build/_e
          gh release download egitim-videolari -p 'egitim_*.mp4' -D build/_e --clobber || echo "Henüz tanıtım videosu yok."
          for f in build/_e/egitim_*.mp4; do
            [ -e "$f" ] || continue
            dil=$(basename "$f" .mp4); dil=${dil#egitim_}
            if [ "$dil" = tr ]; then hedef=build/site/video/netice_egitim; else mkdir -p "build/site/video/$dil"; hedef="build/site/video/$dil/egitim"; fi
            ffmpeg -v error -y -i "$f" -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 26 -c:a aac -b:a 128k -movflags +faststart "$hedef.mp4" \
              && ffmpeg -v error -y -ss 5 -i "$f" -frames:v 1 -vf scale=1280:-2 -q:v 4 "$hedef.jpg" \
              || echo "::warning::$dil tanıtım videosu hazırlanamadı"
          done
          ls -la build/site/video build/site/video/*/egitim.mp4 2>/dev/null | head -40

      # Örnek raporlar sayfasının görselleri her dilde, uygulamanın kendi PDF'lerinden.
      # Bu adım başarısız olursa site Türkçe görsellerle (web-sitesi/img/raporlar) yayınlanır.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Örnek rapor görselleri (15 dil)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq poppler-utils >/dev/null
          flutter pub get
          flutter test tool/ornek_raporlar_test.dart --dart-define=LANGS=tr,en,de,fr,es,it,pt,ru,ar,az,zh,ja,ko,hi,id
          tool/site/ornek_raporlar.sh site build/site

      - name: Kullanım kılavuzu PDF'leri (kilavuz-pdf sürümü)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/site/kilavuz
          gh release download kilavuz-pdf -D build/site/kilavuz --clobber 2>/dev/null || echo "Henüz kılavuz sürümü yok; bağlantılar GitHub sürümüne gider."
          ls -la build/site/kilavuz

      - name: 15 dile çevir (yalnız değişen cümleler çevrilir)
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tool/site/cevir.py web-sitesi build/site

      - name: Türkçe bilgisayar videosu (yüksek kaliteli sürüm varsa)
        run: |
          if [ -f build/site/video/tr/bilgisayar.mp4 ]; then
            mv build/site/video/tr/bilgisayar.mp4 build/site/video/netice_bilgisayar.mp4
            [ -f build/site/video/tr/bilgisayar.jpg ] && mv build/site/video/tr/bilgisayar.jpg build/site/video/netice_bilgisayar.jpg
          fi
          rm -rf build/site/video/tr
          find build/site -size +25M -print | sed 's/^/::error::25 MiB sınırını aşıyor: /' | grep . && exit 1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: site-ceviri-bellegi
          path: build/_site_ceviri

      - name: Bağlantılar ve dosyalar yerinde mi?
        run: |
          set -euo pipefail
          cd build/site
          eksik=0
          while IFS= read -r f; do
            d=$(dirname "$f")
            for yol in $(grep -oE '(href|src|poster)="[^"#:?]+"' "$f" | sed -E 's/^(href|src|poster)="([^"]+)"$/\2/'); do
              [ -z "$yol" ] && continue
              case "$yol" in /*) hedef=".$yol";; *) hedef="$d/$yol";; esac
              case "$hedef" in */) hedef="${hedef}index.html";; esac
              if [ ! -e "$hedef" ]; then echo "::error file=$f::Eksik dosya: $yol"; eksik=1; fi
            done
          done < <(find . -name '*.html')
          test "$eksik" = 0

      - name: Yayınla
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID secret'ları gerekli."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then DAL=onizleme; else DAL=main; fi
          npx --yes wrangler@4 pages deploy build/site --project-name=neticeoptik --branch="$DAL" --commit-dirty=true | tee yayin.log
          ADRES=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' yayin.log | tail -n1 || true)
          {
            if [ "$DAL" = main ]; then echo "### Site yayında: https://www.neticeoptik.com"; else echo "### Önizleme: https://onizleme.neticeoptik.pages.dev"; fi
            echo "Bu yükleme: $ADRES"
          } >> "$GITHUB_STEP_SUMMARY"
          # Videolar ileri/geri sarılabilsin: sunucu parça isteğine 206 vermeli (_worker.js).
          if [ -n "$ADRES" ]; then
            sleep 10
            KOD=$(curl -s -o /dev/null -w '%{http_code}' -r 1000-1999 "$ADRES/video/netice_bilgisayar.mp4" || true)
            echo "Video parça isteği: HTTP $KOD (206 olmalı)" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$KOD" = 206 ] || echo "::warning::Video parça isteği 206 dönmedi ($KOD); videolar sarılamayabilir."
          fi
