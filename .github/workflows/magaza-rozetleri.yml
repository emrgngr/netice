# Google Play, App Store, Mac App Store ve Microsoft Store'un resmî "indir"
# rozetlerini (15 dil) indirip assets/badges/ klasörüne koyar. Uygulama
# içinde SVG çizilemediği için SVG rozetlerin PNG kopyası da üretilir
# (yükseklik 180 px, değiştirilmeden). ve aynı dala gönderir. Rozetler resmî
# kaynaklardan değiştirilmeden alınır (marka kuralları gereği yeniden çizilmez).
name: Mağaza rozetleri

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/magaza-rozetleri.yml'

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin >/dev/null
      - name: Rozetleri indir
        run: |
          set -euo pipefail
          mkdir -p assets/badges
          # uygulama dili : Google dil kodu : Apple yerel kodu
          for satir in tr:tr:tr-tr en:en:en-us az:az:en-us de:de:de-de ar:ar:ar-sa es:es:es-es ru:ru:ru-ru it:it:it-it fr:fr:fr-fr zh:zh-cn:zh-cn ja:ja:ja-jp pt:pt-br:pt-br hi:hi:hi-in id:id:id-id ko:ko:ko-kr; do
            IFS=: read -r dil g a <<< "$satir"
            if ! curl -fsSL -o "assets/badges/google_play_$dil.png" "https://play.google.com/intl/en_us/badges/static/images/badges/${g}_badge_web_generic.png"; then
              echo "Google Play rozeti yok: $g → en"
              curl -fsSL -o "assets/badges/google_play_$dil.png" "https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
            fi
            ok=0
            for url in "https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-app-store/black/$a" \
                       "https://toolbox.marketingtools.apple.com/api/badges/download-on-the-app-store/black/$a"; do
              if curl -fsSL -o "assets/badges/app_store_$dil.svg" "$url" && grep -q '<svg' "assets/badges/app_store_$dil.svg"; then ok=1; break; fi
            done
            if [ $ok = 0 ]; then
              echo "App Store rozeti yok: $a → İngilizce"
              curl -fsSL -o "assets/badges/app_store_$dil.svg" "https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
            fi
            ok=0
            for url in "https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-mac-app-store/black/$a" \
                       "https://toolbox.marketingtools.apple.com/api/badges/download-on-the-mac-app-store/black/$a" \
                       "https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-mac-app-store/black/en-us"; do
              if curl -fsSL -o "assets/badges/mac_app_store_$dil.svg" "$url" && grep -q '<svg' "assets/badges/mac_app_store_$dil.svg"; then ok=1; break; fi
            done
            [ $ok = 1 ] || { echo "Mac App Store rozeti alınamadı: $a"; rm -f "assets/badges/mac_app_store_$dil.svg"; }
            # Microsoft Store "Get it from Microsoft" rozeti (koyu).
            m=$a; [ "$dil" = az ] && m=en-us
            if ! { curl -fsSL -o "assets/badges/microsoft_$dil.svg" "https://get.microsoft.com/images/${m}%20dark.svg" && grep -q '<svg' "assets/badges/microsoft_$dil.svg"; }; then
              echo "Microsoft rozeti yok: $m → en-us"
              curl -fsSL -o "assets/badges/microsoft_$dil.svg" "https://get.microsoft.com/images/en-us%20dark.svg" || rm -f "assets/badges/microsoft_$dil.svg"
            fi
          done
          # PNG kopyaları (uygulama ve video için).
          for f in assets/badges/*.svg; do
            rsvg-convert -h 180 -o "${f%.svg}.png" "$f"
          done
          file assets/badges/* | sed 's/^/  /'
          for f in assets/badges/*.png; do file "$f" | grep -q PNG || { echo "PNG değil: $f"; exit 1; }; done
          for f in assets/badges/*.svg; do grep -q '<svg' "$f" || { echo "SVG değil: $f"; exit 1; }; done
      - name: Dala gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badges
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Mağaza rozetleri (resmî, 15 dil)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
