# "Nottan soru üret" özelliğinin küçük sunucusunu (Cloudflare Worker) yayınlar.
#
# Gerekli GitHub secret'ları (Settings > Secrets and variables > Actions):
#   ANTHROPIC_API_KEY      Claude API anahtarı (console.anthropic.com)
#   CLOUDFLARE_API_TOKEN   Cloudflare "Edit Cloudflare Workers" şablonlu API token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare hesap kimliği
# Secret'lar eklenmemişse iş hata vermeden atlanır.
name: Soru sunucusu

on:
  workflow_dispatch:
  push:
    branches: [main, ilk-surum]
    paths:
      - 'sunucu/soru-uretici/**'
      - '.github/workflows/soru-sunucusu.yml'

concurrency:
  group: soru-sunucusu
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunucu/soru-uretici
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      - name: Secret'lar var mı?
        id: hazir
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY, CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID secret'ları eklenmemiş; yayın atlandı."
            echo "tamam=0" >> "$GITHUB_OUTPUT"
          else
            echo "tamam=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Kota deposu (KV) hazırla
        if: steps.hazir.outputs.tamam == '1'
        run: |
          set -euo pipefail
          bul() {
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
              | jq -r '.result[] | select(.title == "netice-soru-kota") | .id' | head -n1
          }
          ID=$(bul)
          if [ -z "$ID" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data '{"title":"netice-soru-kota"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" > /dev/null
            ID=$(bul)
          fi
          test -n "$ID"
          sed -i "s/KV_ID_BURAYA/$ID/" wrangler.toml

      - name: Yayınla
        if: steps.hazir.outputs.tamam == '1'
        run: |
          set -euo pipefail
          npx wrangler deploy | tee yayin.log
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          ADRES=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' yayin.log | head -n1 || true)
          echo "Sunucu adresi: $ADRES"
          echo "### Soru sunucusu yayında" >> "$GITHUB_STEP_SUMMARY"
          echo "Adres: \`$ADRES\`" >> "$GITHUB_STEP_SUMMARY"
          echo "ADRES=$ADRES" >> "$GITHUB_ENV"

      # Yeni workers.dev adresinin sertifikası birkaç dakikada hazır olur; o yüzden bekleyerek dener.
      - name: Sunucuyu dene
        if: steps.hazir.outputs.tamam == '1' && env.ADRES != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -m 20 "$ADRES/"; then echo; break; fi
            echo "Adres henüz hazır değil, 30 sn sonra yeniden denenecek ($i/20)"
            sleep 30
          done
          # Yeni sürümün her yere ulaşması birkaç saniye sürebilir.
          sleep 20
          # Gerçek bir deneme: her türden 1 soru üretir (anahtar, model ve türler çalışıyor mu).
          NOT='Fotosentez, yeşil bitkilerin ışık enerjisini kullanarak karbondioksit ve sudan glikoz ve oksijen ürettiği olaydır. Kloroplastlarda gerçekleşir; klorofil ışığı soğurur.'
          jq -n --arg t "$NOT" '{note:{subject:"Biyoloji",topic:"Fotosentez",text:$t},count:4,choices:5,lang:"tr",types:["multiple","true_false","fill","open"]}' > deneme.json
          KOD=$(curl -sS -m 180 -o cevap.json -w '%{http_code}' -X POST "$ADRES/uret" \
            -H 'content-type: application/json' -H 'x-netice-app: netice-app-1' -H 'x-netice-device: github-deneme-01' \
            --data @deneme.json)
          echo "HTTP $KOD"
          jq '{sorular: [.questions[] | {tur: .type, soru: .text, cevap: (if .type == "multiple" then .choices[.correct] elif .type == "true_false" then (if .correct == 0 then "Doğru" else "Yanlış" end) else .answer end), konu: .topic}], hata: .error, sorun: .problem}' cevap.json || cat cevap.json
          test "$KOD" = "200"
          test "$(jq '[.questions[].type] | unique | length' cevap.json)" -ge 3
          # Belgeden ayıklama denemesi: iki hazır soru ve sondaki cevap anahtarı.
          BELGE=$'TEST 1 — Hücre\n1) Hücrenin enerji santrali hangisidir?\nA) Ribozom B) Mitokondri C) Golgi D) Lizozom\n2) Bitki hücresinde bulunup hayvan hücresinde bulunmayan yapı hangisidir?\nA) Hücre zarı B) Çekirdek C) Hücre duvarı D) Sitoplazma\n\nCevap Anahtarı: 1-B 2-C'
          jq -n --arg t "$BELGE" '{mode:"extract",solve:false,lang:"tr",note:{subject:"Biyoloji",text:$t}}' > ayikla.json
          KOD=$(curl -sS -m 180 -o ayikla_cevap.json -w '%{http_code}' -X POST "$ADRES/uret" \
            -H 'content-type: application/json' -H 'x-netice-app: netice-app-1' -H 'x-netice-device: github-deneme-01' \
            --data @ayikla.json)
          echo "Ayıklama HTTP $KOD"
          jq '{sorular: [.questions[] | {no: .number, soru: .text, cevap: (if .correct >= 0 then .choices[.correct] else null end), kaynak: .answer_source}], hak: .cost, sorun: .problem}' ayikla_cevap.json || cat ayikla_cevap.json
          test "$KOD" = "200"
          test "$(jq '.questions | length' ayikla_cevap.json)" = "2"
          test "$(jq -r '.questions[0].choices[.questions[0].correct]' ayikla_cevap.json)" = "Mitokondri"
          test "$(jq -r '.questions[1].answer_source' ayikla_cevap.json)" = "document"
