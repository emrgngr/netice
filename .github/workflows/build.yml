name: Test ve derleme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows programı
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Açılış melodisi
        shell: bash
        run: |
          f=$(python3 -c "import json;print(json.load(open('tool/video/muzik.json'))['acilis'])" 2>/dev/null || python -c "import json;print(json.load(open('tool/video/muzik.json'))['acilis'])")
          curl -sSfL --retry 3 -o assets/sounds/acilis.mp3 "https://d8j0ntlcm91z4.cloudfront.net/user_3HBbhHFwxHnCS5yFDPNhwCMiEXw/$f" || echo 'melodi indirilemedi'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      - name: Visual C++ kitaplıklarını programın yanına koy
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" build/windows/x64/runner/Release/
          }
      - name: Kurulum programını oluştur
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v" windows/installer/netice.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        with:
          name: Netice-Windows-Kurulum
          path: build/installer/Netice-Kurulum.exe
          compression-level: 0
      - uses: actions/upload-artifact@v5
        with:
          name: Netice-Windows-Klasor
          path: build/windows/x64/runner/Release/
      # Microsoft Store paketi: Partner Center'daki ürün kimliği GitHub
      # değişkenlerine (Settings > Secrets and variables > Actions > Variables)
      # girilince üretilir: MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER,
      # MSSTORE_PUBLISHER_NAME. Paket imzasızdır; Store yüklemede imzalar.
      - name: Microsoft Store paketi (MSIX)
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)').Matches[0].Groups
          $msixVersion = "$($v[1].Value).$($v[2].Value).$($v[3].Value).0"
          dart run msix:create --store --build-windows false `
            --identity-name "${{ vars.MSSTORE_IDENTITY_NAME }}" `
            --publisher "${{ vars.MSSTORE_PUBLISHER }}" `
            --publisher-display-name "${{ vars.MSSTORE_PUBLISHER_NAME }}" `
            --version $msixVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
        with:
          name: Netice-MicrosoftStore-MSIX
          path: build/windows/x64/runner/Release/*.msix
          compression-level: 0

  macos:
    name: Mac programı
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Açılış melodisi
        shell: bash
        run: |
          f=$(python3 -c "import json;print(json.load(open('tool/video/muzik.json'))['acilis'])")
          curl -sSfL --retry 3 -o assets/sounds/acilis.mp3 "https://d8j0ntlcm91z4.cloudfront.net/user_3HBbhHFwxHnCS5yFDPNhwCMiEXw/$f" || echo 'melodi indirilemedi'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-number=${{ github.run_number }} --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      # Apple geliştirici imzası yok: uygulama yerel (ad-hoc) imzalı. İlk açılışta
      # Sistem Ayarları > Gizlilik ve Güvenlik > "Yine de Aç" gerekir.
      - name: DMG oluştur
        run: |
          mkdir -p build/dmg
          cp -R build/macos/Build/Products/Release/Netice.app build/dmg/
          ln -s /Applications build/dmg/Uygulamalar
          codesign --force --deep --sign - build/dmg/Netice.app
          hdiutil create -volname Netice -srcfolder build/dmg -ov -format UDZO build/Netice-Mac.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: Netice-Mac
          path: build/Netice-Mac.dmg
          compression-level: 0

  android:
    name: Android uygulaması (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Açılış melodisi
        shell: bash
        run: |
          f=$(python3 -c "import json;print(json.load(open('tool/video/muzik.json'))['acilis'])" 2>/dev/null || python -c "import json;print(json.load(open('tool/video/muzik.json'))['acilis'])")
          curl -sSfL --retry 3 -o assets/sounds/acilis.mp3 "https://d8j0ntlcm91z4.cloudfront.net/user_3HBbhHFwxHnCS5yFDPNhwCMiEXw/$f" || echo 'melodi indirilemedi'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      # Mağaza imza anahtarı GitHub gizli değişkenlerinden gelir; yoksa deneme
      # anahtarıyla imzalanır (telefona kurulur ama Play'e yüklenemez).
      - name: Yükleme anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-netice}" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "Mağaza anahtarıyla imzalanacak."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 yok; deneme anahtarıyla imzalanıyor."
          fi
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v5
        with:
          name: Netice-Android
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Netice-GooglePlay-AAB
          path: build/app/outputs/bundle/release/app-release.aab
      - name: İmza parmak izi (Google girişi için SHA-1)
        continue-on-error: true
        run: |
          A=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$A" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E 'DN|SHA-1|SHA-256'

  ios:
    name: iPhone derlemesi (imzasız)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Açılış melodisi
        shell: bash
        run: |
          f=$(python3 -c "import json;print(json.load(open('tool/video/muzik.json'))['acilis'])" 2>/dev/null || python -c "import json;print(json.load(open('tool/video/muzik.json'))['acilis'])")
          curl -sSfL --retry 3 -o assets/sounds/acilis.mp3 "https://d8j0ntlcm91z4.cloudfront.net/user_3HBbhHFwxHnCS5yFDPNhwCMiEXw/$f" || echo 'melodi indirilemedi'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      # Google girişi için iOS istemci kimliğinin ters hâli URL şeması olarak eklenir.
      - name: Google giriş URL şeması
        env:
          IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -n "$IOS_CLIENT_ID" ]; then
            REV=$(echo "$IOS_CLIENT_ID" | awk -F. '{for(i=NF;i>0;i--) printf "%s%s", $i, (i>1?".":"")}')
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :GIDClientID string $IOS_CLIENT_ID" ios/Runner/Info.plist
          fi
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}
