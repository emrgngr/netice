name: iPhone App Store

# İmzalı iPhone uygulamasını (IPA) derler ve App Store Connect'e (TestFlight)
# yükler. İmza sertifikası ve profil, App Store Connect API anahtarıyla
# Xcode tarafından otomatik oluşturulur; depoda sertifika tutulmaz.
# Gerekli secret'lar: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (.p8 içeriği),
# APPLE_TEAM_ID. İsteğe bağlı: GOOGLE_IOS_CLIENT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      yukle:
        description: 'App Store Connect (TestFlight) için yükle'
        type: boolean
        default: true
      satis_kapali:
        description: 'Satın alma bölümlerini gizle (App Store ücretli anlaşması onaylanana kadar)'
        type: boolean
        default: false

jobs:
  ipa:
    name: iPhone uygulaması (App Store)
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Anahtarlar var mı?
        id: hazir
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::App Store anahtarları eklenmemiş (ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY, APPLE_TEAM_ID); iPhone yüklemesi atlandı."
            echo "tamam=0" >> "$GITHUB_OUTPUT"
          else
            echo "tamam=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.hazir.outputs.tamam == '1'
      - name: Açılış melodisi
        if: steps.hazir.outputs.tamam == '1'
        run: |
          f=$(python3 -c "import json;print(json.load(open('tool/video/muzik.json'))['acilis'])")
          curl -sSfL --retry 3 -o assets/sounds/acilis.mp3 "https://d8j0ntlcm91z4.cloudfront.net/user_3HBbhHFwxHnCS5yFDPNhwCMiEXw/$f" || echo 'melodi indirilemedi'
      - uses: subosito/flutter-action@v2
        if: steps.hazir.outputs.tamam == '1'
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: API anahtarı
        if: steps.hazir.outputs.tamam == '1'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8
          printf '%s\n' "$ASC_PRIVATE_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          # Gizli değerlerin sonunda boşluk/satır sonu kalırsa Apple 401 verir; temizlenmiş kopyalar.
          KID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]'); ISS=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$KID"; echo "::add-mask::$ISS"
          echo "ASC_KID=$KID" >> "$GITHUB_ENV"; echo "ASC_ISS=$ISS" >> "$GITHUB_ENV"
      - name: Anahtarı Apple ile doğrula
        if: steps.hazir.outputs.tamam == '1'
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt
          kid = os.environ['ASC_KEY_ID'].strip(); iss = os.environ['ASC_ISSUER_ID'].strip()
          key = open(os.environ['ASC_KEY_PATH']).read()
          print('Key ID uzunluğu:', len(kid), '| Issuer ID uzunluğu:', len(iss), '| Team ID uzunluğu:', len(os.environ['APPLE_TEAM_ID'].strip()))
          print('Anahtar dosyası BEGIN/END:', 'BEGIN PRIVATE KEY' in key, 'END PRIVATE KEY' in key)
          tok = jwt.encode({'iss': iss, 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})
          req = urllib.request.Request('https://api.appstoreconnect.apple.com/v1/apps?fields[apps]=bundleId', headers={'Authorization': 'Bearer ' + tok})
          try:
              d = json.load(urllib.request.urlopen(req))
              print('Apple girişi tamam. Uygulamalar:', [a['attributes']['bundleId'] for a in d['data']])
          except urllib.error.HTTPError as e:
              print('Apple yanıtı', e.code, e.read().decode()[:500])
              raise SystemExit(1)
          for path in ['/v1/certificates?limit=5', '/v1/profiles?limit=5', '/v1/bundleIds?filter[identifier]=com.netice.netice']:
              r = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, headers={'Authorization': 'Bearer ' + tok})
              try:
                  d = json.load(urllib.request.urlopen(r))
                  print(path, '→ izin var,', len(d['data']), 'kayıt', [x['attributes'].get('certificateType') or x['attributes'].get('profileType') or x['attributes'].get('identifier') for x in d['data']])
              except urllib.error.HTTPError as e:
                  print(path, '→', e.code, e.read().decode()[:300])
          PY
      - name: Google giriş URL şeması
        if: steps.hazir.outputs.tamam == '1'
        env:
          IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -n "$IOS_CLIENT_ID" ]; then
            REV=$(echo "$IOS_CLIENT_ID" | awk -F. '{for(i=NF;i>0;i--) printf "%s%s", $i, (i>1?".":"")}')
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :GIDClientID string $IOS_CLIENT_ID" ios/Runner/Info.plist
          fi
      - name: Flutter hazırlığı
        if: steps.hazir.outputs.tamam == '1'
        run: |
          flutter pub get
          flutter build ios --release --config-only --no-codesign --build-number=${{ github.run_number }} --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} --dart-define=SATIS_KAPALI=${{ inputs.satis_kapali && 'true' || 'false' }}
      - name: Sertifika ve profil (App Store Connect API)
        if: steps.hazir.outputs.tamam == '1'
        run: |
          python3 tool/ios_imza.py hazirla
          KC=$RUNNER_TEMP/imza.keychain-db; KCP=$(openssl rand -hex 12)
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          P12P=$(openssl rand -hex 12)
          openssl x509 -inform DER -in build/imza/dagitim.cer -out build/imza/dagitim.pem
          openssl pkcs12 -export -legacy -inkey build/imza/dagitim.key -in build/imza/dagitim.pem -out build/imza/dagitim.p12 -passout pass:$P12P 2>/dev/null \
            || openssl pkcs12 -export -inkey build/imza/dagitim.key -in build/imza/dagitim.pem -out build/imza/dagitim.p12 -passout pass:$P12P
          security import build/imza/dagitim.p12 -k "$KC" -P "$P12P" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build/imza/netice.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$(python3 -c "import json;print(json.load(open('build/imza/durum.json'))['uuid'])").mobileprovision
          security find-identity -v -p codesigning "$KC"
          python3 tool/ios_imza.py runner
      - name: Arşiv (imzalı)
        if: steps.hazir.outputs.tamam == '1'
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive \
            archive | tail -40
          test -d build/Runner.xcarchive
      - name: IPA
        if: steps.hazir.outputs.tamam == '1'
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.netice.netice</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa | tail -20
          ls -la build/ipa
      - uses: actions/upload-artifact@v4
        if: steps.hazir.outputs.tamam == '1'
        with:
          name: Netice-iPhone-IPA
          path: build/ipa/*.ipa
      - name: App Store Connect'e yükle (TestFlight)
        if: steps.hazir.outputs.tamam == '1' && (github.event_name == 'push' || inputs.yukle)
        run: |
          xcrun altool --upload-app --type ios -f build/ipa/*.ipa \
            --apiKey "$ASC_KID" --apiIssuer "$ASC_ISS"
      - name: Geçici sertifika ve profili sil
        if: always() && steps.hazir.outputs.tamam == '1'
        run: python3 tool/ios_imza.py temizle
